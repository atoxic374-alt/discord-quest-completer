<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Discord Token Test</title>
  <style>
    body{background:#0f0d12;color:#e2d8f0;font-family:monospace;padding:28px;max-width:780px;margin:0 auto;}
    h1{color:#d4406e;margin-bottom:4px;}
    .sub{color:#888;font-size:13px;margin-bottom:28px;}
    .card{background:#1a1525;border:1px solid #2a2040;border-radius:12px;padding:18px 22px;margin-bottom:14px;}
    .row{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
    .badge{min-width:80px;text-align:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;flex-shrink:0;}
    .pending{background:rgba(100,100,100,.2);color:#888;border:1px solid #444;}
    .ok    {background:rgba(31,138,90,.2);color:#3ecc8c;border:1px solid rgba(31,138,90,.4);}
    .fail  {background:rgba(196,48,64,.2);color:#e05060;border:1px solid rgba(196,48,64,.4);}
    .warn  {background:rgba(196,122,24,.2);color:#d88a1e;border:1px solid rgba(196,122,24,.4);}
    .info  {background:rgba(80,120,200,.2);color:#7ab4f5;border:1px solid rgba(80,120,200,.4);}
    .label{flex:1;font-size:13px;line-height:1.5;}
    .detail{font-size:11px;color:#777;margin-top:3px;word-break:break-all;}
    pre{background:#110e18;border:1px solid #2a2040;border-radius:8px;padding:12px;font-size:11px;overflow:auto;color:#a0e0b0;max-height:220px;margin:0;}
    button{background:rgba(124,29,74,.35);border:1px solid rgba(212,64,110,.3);color:#d4406e;padding:8px 20px;border-radius:8px;font-size:13px;cursor:pointer;font-family:monospace;}
    button:hover{background:rgba(124,29,74,.55);}
    #spinner{display:none;color:#888;font-size:13px;margin-top:8px;}
  </style>
</head>
<body>
  <h1>🔍 Discord Token Diagnostics</h1>
  <p class="sub">Running automated tests — results appear below in real time.</p>

  <div id="results"></div>
  <p id="spinner">⏳ Running…</p>
  <div style="margin-top:18px;" id="presenceCard" style="display:none"></div>

<script>
const TOKEN = 'MTAzMzgzMTQyMjgxMDY2OTEyNg.GVFH-i.jTDnKSJG_EJgOn1-QKoaj9yVrn_T_MXFKL3SgU';
const API   = 'https://discord.com/api/v10';
const GW    = 'wss://gateway.discord.gg/?v=10&encoding=json';

const results = document.getElementById('results');
const spinner = document.getElementById('spinner');
spinner.style.display = 'block';

function row(id, label) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<div class="row"><span id="b_${id}" class="badge pending">…</span><div class="label"><strong>${label}</strong><div class="detail" id="d_${id}">waiting…</div></div></div>`;
  results.appendChild(d);
  return {
    set(cls, status, detail) {
      document.getElementById('b_'+id).className = 'badge '+cls;
      document.getElementById('b_'+id).textContent = status;
      document.getElementById('d_'+id).textContent = detail || '';
    }
  };
}

function headers(extra={}) {
  return {
    'Authorization': TOKEN,
    'Content-Type':  'application/json',
    'X-Discord-Locale': 'en-US',
    'Accept': 'application/json',
    'X-Super-Properties': btoa(JSON.stringify({
      os:'Windows', browser:'Discord Client', release_channel:'stable',
      client_version:'1.0.9194', platform:'win32', os_version:'10.0.19045', system_locale:'en-US',
    })),
    ...extra
  };
}

async function run() {
  // ── Test 1: Token format ───────────────────────────────────────────────────
  const t1 = row('fmt', '1. Token format');
  const parts = TOKEN.split('.');
  if (parts.length === 3 && TOKEN.length > 50) {
    t1.set('ok','✓ Valid', `Length ${TOKEN.length}, 3-part structure — looks like a user token`);
  } else {
    t1.set('fail','✗ Bad', 'Expected 3-part dot-separated token');
  }

  // ── Test 2: REST /users/@me ────────────────────────────────────────────────
  const t2 = row('rest', '2. REST API — /users/@me');
  try {
    const r = await fetch(`${API}/users/@me`, { headers: headers(), signal: AbortSignal.timeout(10000) });
    if (r.ok) {
      const u = await r.json();
      t2.set('ok','✓ 200 OK', `Logged in as: ${u.global_name} (@${u.username}) · id: ${u.id}`);
    } else {
      const j = await r.json().catch(()=>({}));
      t2.set('fail','✗ '+r.status, JSON.stringify(j));
    }
  } catch(e) { t2.set('fail','✗ Error', e.message); }

  // ── Test 3: Quests ────────────────────────────────────────────────────────
  const t3 = row('quests', '3. REST API — /quests');
  try {
    const r = await fetch(`${API}/quests`, { headers: headers(), signal: AbortSignal.timeout(10000) });
    if (r.status === 404) {
      t3.set('warn','⚠ 404', 'No active quests for this account right now (expected — Discord returns 404 when none are available)');
    } else if (r.ok) {
      const data = await r.json();
      const list = Array.isArray(data) ? data : (data.quests ?? data.items ?? []);
      t3.set('ok','✓ '+r.status, `${list.length} active quest(s) found`);

      // Show quest details
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(list, null, 2);
      results.lastChild.appendChild(pre);
    } else {
      const j = await r.json().catch(()=>({}));
      t3.set('fail','✗ '+r.status, JSON.stringify(j));
    }
  } catch(e) { t3.set('fail','✗ Error', e.message); }

  // ── Test 4: Game DB (GitHub mirror) ───────────────────────────────────────
  const t4 = row('db', '4. Game database — GitHub mirror');
  try {
    const r = await fetch('https://markterence.github.io/discord-quest-completer/detectable.json', {
      signal: AbortSignal.timeout(10000)
    });
    if (r.ok) {
      const data = await r.json();
      t4.set('ok','✓ OK', `${data.length.toLocaleString()} games loaded`);
    } else {
      t4.set('fail','✗ '+r.status, 'Mirror unreachable');
    }
  } catch(e) { t4.set('fail','✗ Error', e.message); }

  // ── Test 5: Discord Gateway WebSocket ─────────────────────────────────────
  const t5 = row('gw', '5. Gateway WebSocket + Presence');
  t5.set('info','⏳ …', 'Connecting to wss://gateway.discord.gg…');
  await new Promise(resolve => {
    const ws = new WebSocket(GW);
    let stage = 'connecting';
    const timer = setTimeout(() => {
      t5.set('fail','✗ Timeout', `Stage: ${stage}`);
      ws.close(); resolve();
    }, 12000);

    ws.onmessage = e => {
      const p = JSON.parse(e.data);
      if (p.op === 10) {
        stage = 'identifying';
        t5.set('info','⏳ …', 'OP10 HELLO received — sending IDENTIFY…');
        ws.send(JSON.stringify({op:2, d:{
          token: TOKEN,
          properties:{os:'windows',browser:'Discord Client',device:'discord'},
          compress:false,
          presence:{status:'online',afk:false,since:null,activities:[{
            name:'Fortnite', type:0, application_id:'432980957394370572'
          }]}
        }}));
      }
      if (p.t === 'READY') {
        stage = 'connected';
        const u = p.d.user;
        t5.set('ok','✓ READY', `Connected as ${u.global_name} (@${u.username}) — Presence sent: Playing "Fortnite"`);
        clearTimeout(timer);
        setTimeout(()=>{ws.close();resolve();}, 1500);
      }
      if (p.op === 9) {
        t5.set('fail','✗ Inv.Session', 'OP9 — Invalid Session (token may be expired or rate limited)');
        clearTimeout(timer);
        ws.close(); resolve();
      }
    };
    ws.onerror = () => {
      t5.set('fail','✗ WS Error', 'WebSocket connection error');
      clearTimeout(timer); resolve();
    };
    ws.onclose = e => {
      if (stage !== 'connected' && stage !== 'error') {
        t5.set('fail','✗ Closed', `Closed at stage: ${stage}, code: ${e.code}`);
        resolve();
      }
    };
  });

  spinner.style.display = 'none';
  const done = document.createElement('p');
  done.style.cssText = 'color:#3ecc8c;font-size:13px;margin-top:6px;';
  done.textContent = '✓ All tests complete.';
  results.appendChild(done);
}

run().catch(e => {
  spinner.textContent = '✗ Fatal error: ' + e.message;
  spinner.style.color = '#e05060';
});
</script>
</body>
</html>
